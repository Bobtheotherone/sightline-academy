[project]
name = "sightline-server"
version = "0.1.0"
description = "Sightline Safety Academy - FastAPI server (ADR-001, SPEC-002)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "pydantic>=2",
    "pydantic-settings",
    "argon2-cffi",
    "itsdangerous",
    "python-multipart",
    "chromadb",
    "sentence-transformers",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# B008: `Depends(...)` in parameter defaults is the idiomatic FastAPI DI pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
