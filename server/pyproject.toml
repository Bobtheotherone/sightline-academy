[project]
name = "sightline-server"
version = "0.1.0"
description = "Sightline Safety Academy - FastAPI server (ADR-001, SPEC-002)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "pydantic>=2",
    "pydantic-settings",
    "argon2-cffi",
    "itsdangerous",
    "python-multipart",
    "chromadb",
    "sentence-transformers",
    # torch is required by sentence-transformers anyway; declared directly so
    # [tool.uv.sources] below can pin CPU wheels for the linux Docker image.
    "torch",
    "httpx",
    "pyyaml",
    # Subscription billing (SPEC-012). Stripe-hosted Checkout, so no card data
    # ever reaches this server; the SDK is used for session creation and for
    # webhook signature verification.
    "stripe>=11",
    # PostgreSQL driver for the hosted deploy (ADR-008). psycopg 3, matching
    # the `postgresql+psycopg://` scheme config.py normalises to. Unused when
    # DATABASE_URL is empty and the app falls back to local SQLite.
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# CPU-only torch wheels for the linux Docker image (SPEC-012: "torch-cpu wheels
# for sentence-transformers"). Without this, PyPI torch drags the full CUDA
# toolkit (~6 GB) into the api image. Windows/macOS keep PyPI torch (already CPU).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# B008: `Depends(...)` in parameter defaults is the idiomatic FastAPI DI pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tmp_path under the (gitignored) cache dir — the default %TEMP%\pytest-of-*
# location is ACL-broken on the dev machine.
addopts = "--basetemp=.pytest_cache/basetemp"
