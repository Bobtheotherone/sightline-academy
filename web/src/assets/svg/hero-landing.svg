<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <!-- Landing hero: rider and machine as a field-guide plate — helmeted rider
       seated on a utility ATV on a blazed trail, ridge and conifers behind. -->
