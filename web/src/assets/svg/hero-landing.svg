  <g fill="none" stroke="#0D1E2E" stroke-opacity="0.06" stroke-width="1">
    <path d="M-10 48 C 70 22, 160 62, 250 42 S 380 26, 410 48"/>
    <path d="M-10 86 C 80 60, 170 100, 260 80 S 380 60, 410 86"/>
    <path d="M-10 268 C 80 246, 180 284, 280 264 S 380 246, 410 268"/>
  </g>
  <circle cx="58" cy="54" r="14" fill="#DBA12E" stroke="#0D1E2E" stroke-width="1.5"/>
  <!-- distant ridge + conifers -->
  <path d="M242 210 Q310 172 396 202" fill="none" stroke="#0D1E2E" stroke-width="1.5" stroke-linecap="round"/>
  <g stroke="#0D1E2E" stroke-width="1.5" stroke-linejoin="round">
    <path d="M350 234 V214" stroke-width="2"/>
    <path d="M350 158 L370 216 H330 Z M350 174 L366 228 H334 Z" fill="#2F6B52"/>
    <path d="M381 210 L393 238 H369 Z" fill="#ABCDB8"/>
  </g>
