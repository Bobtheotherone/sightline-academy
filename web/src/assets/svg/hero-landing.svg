  <path d="M74 240 Q46 247 14 243" fill="none" stroke="#B5446E" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <rect x="-4" y="-4" width="8" height="8" rx="2" transform="translate(52 243) rotate(45)" fill="#B5446E"/>
  <rect x="-4" y="-4" width="8" height="8" rx="2" transform="translate(20 240) rotate(45)" fill="#B5446E"/>
  <!-- machine (shared side-view artwork, scaled) -->
  <g transform="translate(40 78) scale(0.62)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="365" cy="208" r="42" fill="#0D1E2E"/>
