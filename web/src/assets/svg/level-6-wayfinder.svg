<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img">
  <title>Level 6 Wayfinder: a four-point compass rose with a magenta north arm on a graduated green card, over a two-tier contour field.</title>
  <!-- B-028 Level 6 Wayfinder (1000 XP): a graduated compass card with a magenta
       north arm, standing over two nested contour terraces - the step at 6 is the
       rider carrying an INSTRUMENT onto ground they can already read. -->
  <circle cx="64" cy="64" r="61" fill="#F9FCFA" stroke="#0D1E2E" stroke-width="1.5"/>
  <g fill="none" stroke="#0D1E2E" stroke-opacity="0.06" stroke-width="1">
    <path d="M12 34 Q38 22 64 29 Q90 36 114 30"/>
    <path d="M8 48 Q34 36 62 43 Q90 50 118 44"/>
  </g>

  <!-- the contour field: back terrace, then the near terrace nested inside it -->
  <path d="M3.5 56 Q16 44 34 44 Q54 45 70 54 Q90 65 106 72 Q115 77 121.6 84 A61 61 0 0 1 3.5 56 Z" fill="#ECF3EF" stroke="#0D1E2E" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M7.1 86 Q22 74 42 74 Q64 74 84 84 Q100 92 114.6 98 A61 61 0 0 1 7.1 86 Z" fill="#ABCDB8" stroke="#0D1E2E" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- the compass card, concentric with the disc -->
  <circle cx="64" cy="64" r="40" fill="#2F6B52" stroke="#0D1E2E" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="31" fill="none" stroke="#ABCDB8" stroke-width="2.4"/>
  <path d="M64 29.1 V27.7 M98.9 64 H100.3 M64 98.9 V100.3 M29.1 64 H27.7 M88.7 39.3 L89.7 38.3 M88.7 88.7 L89.7 89.7 M39.3 88.7 L38.3 89.7 M39.3 39.3 L38.3 38.3" fill="none" stroke="#ABCDB8" stroke-width="2.6" stroke-linecap="round"/>

  <!-- the rose: four arms, north filled, a paper pivot over the needle root -->
  <path d="M64 37 L71.9 56.1 L91 64 L71.9 71.9 L64 91 L56.1 71.9 L37 64 L56.1 56.1 Z" fill="#F9FCFA" stroke="#0D1E2E" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M64 37 L71.9 56.1 L64 64 L56.1 56.1 Z" fill="#B5446E" stroke="#0D1E2E" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="3.4" fill="#F9FCFA" stroke="#0D1E2E" stroke-width="1.5"/>
</svg>
