<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img">
  <!-- Certificate seal: rope border, pine ring, blaze-and-summit center.
       Designed to hold in grayscale print. -->
  <circle cx="120" cy="120" r="113" fill="#F9FCFA" stroke="#0D1E2E" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="99" fill="none" stroke="#0D1E2E" stroke-width="1.5"/>
  <g stroke="#0D1E2E" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M124 8 L114 20" transform="rotate(0 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(10 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(20 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(30 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(40 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(50 120 120)"/>
