    <path d="M124 8 L114 20" transform="rotate(80 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(90 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(100 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(110 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(120 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(130 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(140 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(150 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(160 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(170 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(180 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(190 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(200 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(210 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(220 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(230 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(240 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(250 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(260 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(270 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(280 120 120)"/>
    <path d="M124 8 L114 20" transform="rotate(290 120 120)"/>
