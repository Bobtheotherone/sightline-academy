<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" fill="none" stroke="#0D1E2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- C-101 Front brake lever.
       Researched form (US5311792A): the blade tapers from wide at the pivot to narrow at
       the tip, the inner surface is concave toward the grip, and the distal end carries a
       BALL. Blade and ball are one casting drawn in two passes so they union seamlessly.
       Sweep stays SHALLOW (~17 degrees) — steeper drafts read as drooping.
       The blade's proximal cap stays INSIDE the neck's footprint; started further left it
       poked past the perch as a stub. The perch itself is a compact block necking down to
       the lever mount and carries no surface detail (a bolt read as a camera, a seam as a
       minus sign, edge ticks as eyes).
       Against C-100: LONG, SMOOTH, TAPERED, sweeps FORWARD — where the thumb paddle is
       short, fat, ridged and hangs down. -->
  <g fill="#0D1E2E" stroke="#0D1E2E" stroke-width="5.2">
    <rect x="9.5" y="11.5" width="15" height="9.5" rx="3"/>
    <rect x="13.5" y="18" width="7.5" height="9" rx="2.5"/>
  </g>
  <g fill="#ECF3EF" stroke="none">
    <rect x="9.5" y="11.5" width="15" height="9.5" rx="3"/>
    <rect x="13.5" y="18" width="7.5" height="9" rx="2.5"/>
  </g>
  <g fill="#0D1E2E" stroke="#0D1E2E" stroke-width="5.2">
    <path d="M17.8 25.4 Q27 29.4 36.5 31.8 L35.9 34.6 Q26 32.3 17 30.6 Q15.9 27.8 17.8 25.4 Z"/>
    <circle cx="38.3" cy="33.6" r="3.1"/>
  </g>
  <g fill="#ABCDB8" stroke="none">
    <path d="M17.8 25.4 Q27 29.4 36.5 31.8 L35.9 34.6 Q26 32.3 17 30.6 Q15.9 27.8 17.8 25.4 Z"/>
    <circle cx="38.3" cy="33.6" r="3.1"/>
  </g>
  <circle cx="19.2" cy="27.4" r="2.2" fill="#ECF3EF"/>
  <circle cx="19.2" cy="27.4" r="0.9" fill="#0D1E2E" stroke="none"/>
</svg>
