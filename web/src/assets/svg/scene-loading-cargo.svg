<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img">
  <!-- Comparison plate, rear view: left machine loaded low, centered, and
       strapped (stable); right machine stacked high and loose (tips). -->
  <rect width="500" height="300" fill="#F9FCFA"/>
  <g fill="none" stroke="#0D1E2E" stroke-opacity="0.06" stroke-width="1">
    <path d="M-10 272 C 90 254, 200 286, 310 268 S 470 254, 510 272"/>
  </g>
  <path d="M250 46 V270" stroke="#D6DFDA" stroke-width="1.5"/>
  <!-- verdict marks -->
  <rect x="-9" y="-9" width="18" height="18" rx="4" transform="translate(140 62) rotate(45)" fill="#2F6B52"/>
  <path d="M134 62 l4 5 8 -9" fill="none" stroke="#F9FCFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="-9" y="-9" width="18" height="18" rx="4" transform="translate(360 62) rotate(45)" fill="#A93226"/>
  <path d="M355 57 l10 10 M365 57 l-10 10" stroke="#F9FCFA" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ================= LEFT: low and centered ================= -->
  <path d="M50 246 H230" stroke="#0D1E2E" stroke-width="1.5" stroke-linecap="round"/>
  <g stroke="#0D1E2E" stroke-width="1.5" stroke-linejoin="round">
    <rect x="82" y="200" width="24" height="46" rx="8" fill="#0D1E2E"/>
    <rect x="174" y="200" width="24" height="46" rx="8" fill="#0D1E2E"/>
    <path d="M82 208 Q82 186 104 184 L176 184 Q198 186 198 208 L198 214 L82 214 Z" fill="#ECF3EF"/>
    <rect x="122" y="166" width="36" height="20" rx="8" fill="#2F6B52"/>
    <path d="M94 158 H186" stroke-width="2.5"/>
    <path d="M94 150 V158 M186 150 V158 M112 152 V158 M140 152 V158 M168 152 V158" stroke-width="1.5"/>
    <path d="M94 150 H186" stroke-width="2.5"/>
    <!-- low, centered case -->
    <rect x="96" y="114" width="88" height="36" rx="5" fill="#ABCDB8"/>
    <path d="M98 152 L178 116 M182 152 L102 116" stroke="#B5446E" stroke-width="2.5" fill="none"/>
    <circle cx="98" cy="150" r="2.5" fill="#B5446E" stroke="none"/>
    <circle cx="182" cy="150" r="2.5" fill="#B5446E" stroke="none"/>
  </g>
  <!-- low center of gravity -->
  <rect x="-6" y="-6" width="12" height="12" rx="3" transform="translate(140 172) rotate(45)" fill="#B5446E" stroke="#0D1E2E" stroke-width="1"/>
  <path d="M140 182 V236" stroke="#0D1E2E" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M135 232 L140 240 L145 232" fill="none" stroke="#0D1E2E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ================= RIGHT: high and loose ================= -->
  <path d="M290 246 H450" stroke="#0D1E2E" stroke-width="1.5" stroke-linecap="round"/>
  <g stroke="#0D1E2E" stroke-width="1.5" stroke-linejoin="round">
    <rect x="302" y="200" width="24" height="46" rx="8" fill="#0D1E2E"/>
    <rect x="394" y="200" width="24" height="46" rx="8" fill="#0D1E2E"/>
    <path d="M302 208 Q302 186 324 184 L396 184 Q418 186 418 208 L418 214 L302 214 Z" fill="#ECF3EF"/>
    <rect x="342" y="166" width="36" height="20" rx="8" fill="#2F6B52"/>
    <path d="M314 158 H406" stroke-width="2.5"/>
    <path d="M314 150 V158 M406 150 V158 M332 152 V158 M360 152 V158 M388 152 V158" stroke-width="1.5"/>
    <path d="M314 150 H406" stroke-width="2.5"/>
    <!-- tall loose stack -->
    <rect x="322" y="116" width="76" height="32" rx="5" fill="#ABCDB8"/>
    <rect x="330" y="82" width="80" height="34" rx="5" fill="#ECF3EF" transform="rotate(-8 370 99)"/>
  </g>
  <!-- wobble marks -->
  <g stroke="#0D1E2E" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M420 78 q6 8 0 16 M430 74 q8 11 0 24"/>
  </g>
  <!-- high center of gravity, tipping -->
  <rect x="-6" y="-6" width="12" height="12" rx="3" transform="translate(366 108) rotate(45)" fill="#A93226" stroke="#0D1E2E" stroke-width="1"/>
  <path d="M366 118 V236" stroke="#0D1E2E" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M366 132 Q396 142 406 164" fill="none" stroke="#A93226" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M406 152 L407 166 L395 162" fill="none" stroke="#A93226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="-5" y="-5" width="10" height="10" rx="2.5" transform="translate(30 274) rotate(45)" fill="#B5446E"/>
</svg>
