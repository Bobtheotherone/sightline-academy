<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Identity set (VISUAL_ASSETS B-061..B-068). SVG first for sharp tabs at
         any DPI; the PNGs are the fallback for browsers that ignore it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#C4622D" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E2A23" />

    <title>Sightline Safety Academy</title>
    <meta
      name="description"
      content="A free online ATV and road safety course built around judgment, not fear. Six modules, a field journal, and Ranger — a safety tutor that knows the course inside out."
    />

    <!-- Link previews. Paths are root-relative because the deploy origin is not
         known at build time and the app must build with no network; scrapers
         that require an absolute og:image resolve it against the page URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sightline Safety Academy" />
    <meta property="og:title" content="Sightline Safety Academy" />
    <meta
      property="og:description"
      content="Ride like you've thought it through. A free ATV and road safety course built around judgment, not fear."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sightline Safety Academy — a free ATV and road safety course built around judgment, not fear."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sightline Safety Academy" />
    <meta
      name="twitter:description"
      content="Ride like you've thought it through. A free ATV and road safety course built around judgment, not fear."
    />
    <meta name="twitter:image" content="/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
