@keyframes stb-a{0%,35%{transform:rotate(0deg)}40.5%,58.5%{transform:rotate(13deg)}62%,70%{transform:rotate(30deg)}75.5%,100%{transform:rotate(0deg)}}
.stb-cog{animation:stb-c 12s ease-in-out infinite}
@keyframes stb-c{0%,35%{transform:translate(0px,0px)}40.5%,47%{transform:translate(47.9px,-26.7px)}52%,58.5%{transform:translate(9px,-35.7px)}62%,70%{transform:translate(141.4px,-85.7px)}75.5%,100%{transform:translate(0px,0px)}}
.stb-pl{animation:stb-p 12s ease-in-out infinite;transform-box:view-box;transform-origin:600px 463px}
@keyframes stb-p{0%,35%{transform:scaleY(1)}40.5%,58.5%{transform:scaleY(1.024)}62%,70%{transform:scaleY(1.388)}75.5%,100%{transform:scaleY(1)}}
.stb-mgd{animation:stb-m 12s ease-in-out infinite,stb-k 12s step-end infinite}
@keyframes stb-m{0%,35%{stroke-dashoffset:53}40.5%,47%{stroke-dashoffset:70.4}52%,58.5%{stroke-dashoffset:56.3}62%,70%{stroke-dashoffset:94.3}75.5%,100%{stroke-dashoffset:53}}
@keyframes stb-k{0%{stroke:#2F6B52}37%{stroke:#DBA12E}49%{stroke:#2F6B52}59%{stroke:#A93226}72%{stroke:#2F6B52}}
.stb-mgu{animation:stb-u 12s ease-in-out infinite}
@keyframes stb-u{0%,35%{stroke-dashoffset:53}40.5%,47%{stroke-dashoffset:35.6}52%,58.5%{stroke-dashoffset:49.7}62%,70%{stroke-dashoffset:6.4}75.5%,100%{stroke-dashoffset:53}}
.stb-rd{animation:stb-r 12s ease-in-out infinite;transform-box:view-box;transform-origin:200px 158px}
@keyframes stb-r{0%,47%{transform:rotate(0deg)}52%,58.5%{transform:rotate(-16deg)}62%,100%{transform:rotate(0deg)}}
.stb-bx{animation:stb-b 12s ease-in-out infinite}
@keyframes stb-b{0%,56.5%{transform:translate(0px,90px);opacity:0}59.5%{transform:translate(0px,26px);opacity:0}62%,70%{transform:translate(0px,0px);opacity:1}73%{transform:translate(0px,26px);opacity:0}76%,100%{transform:translate(0px,90px);opacity:0}}
@media (prefers-reduced-motion:reduce){.stb-tilt,.stb-cog,.stb-pl,.stb-mgd,.stb-mgu,.stb-rd,.stb-bx{animation:none}}
</style>
