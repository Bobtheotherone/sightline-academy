<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
<title>A rear view of a geared rider on a quad with the centre of gravity marked low in the rider and a plumb line falling inside the track width; the ground tilts and the plumb line walks toward the downhill tire while the support margin shrinks, the rider moving uphill wins it back, and a load on the rack raises the centre of gravity and takes it away again. Four medallions show the same model on a climb, across a side-hill, with the rider's weight moved uphill, and carrying a rear load.</title>
<!-- C-006 "One stability model, four applications".

     Caption this plate serves: the centre of gravity's plumb line has to land
     inside the support base; slopes, side-hills, rider position and loads are
     four faces of that one rule.

     HOTSPOT PLATE. The block's four seals are already placed, so these
     medallion centres are BINDING: slopes (233,178), sidehill (967,178),
     position (232,585), loads (966,585), r = 150. No magenta anywhere - the
     seals are the only magenta on the page.

     GEOMETRY. Centre machine: symbol space 400 wide, ground at symbol y 400,
     placed by translate(430 320) scale(0.85) -> track 458.9..741.1, ground
     y 660, centreline x 600. Everything tilts about the downhill contact
     (741.1,660). The plumb line is NOT in the tilting group: it hangs from the
     CoG in world space and stays vertical, which is the whole point.
     ONE LINE WEIGHT: no symbol sets its own outline width; each instance sets
     stroke-width on its wrapper (4.24 x 0.85 and 8.6 x 0.42 both land on 3.6),
     so the medallion machines are drawn at exactly the centre machine's weight.

     MARGIN BAR. Two spruce segments on the ground bracket, one either side of
     the plumb foot, each a pathLength=100 dash whose offset is its length. At
     rest they are equal - the symmetry is what makes the asymmetry mean
     something later. Only the DOWNHILL segment recolours.

     BEATS (12s loop, every element on the same 12s clock, holds to 100%):
       0-35%     rest: level, plumb centred, both margins spruce and equal.
       35-40.5%  ground + machine roll to 13 degrees; plumb walks downhill;
                 downhill margin 141 -> 92 units and turns amber.
       47-52%    rider moves uphill; CoG walks back; margin 92 -> 132, spruce.
                 (the correction, and the only one the rider actually owns)
       58.5-62%  a load lands on the rear rack, rider back upright: the CoG
                 rises 56 symbol units into the load AND the ground steepens
                 13 -> 30 degrees, because 30 is the angle at which THIS
                 machine actually loses it: half-track 141, CoG 197+48 above
                 the ground, tan(t) = 141/245 -> t = 30. At 13 degrees the
                 plumb cannot reach the tire edge without an off-the-machine
                 CoG, so the beat steepens rather than draw a falsehood. The
                 downhill margin collapses to a 16-unit brick-red pip at the
                 contact and the plumb lands just outboard of it.
       70-75.5%  ease back to level. 75.5-100% hold (7.1s of rest per loop).
     13 degrees is the ceiling for the SLOPE beats on purpose: a plate that
     draws an angle at which the machine reads as falling teaches the picture,
     not the model. 30 degrees appears only in the loaded beat, where losing it
     is the point.

     RIDER LEAN. The handlebar, both grips, both gloves and both arms live in
     #stb-bars / #stb-hands, which never animate. Only the torso + helmet
     (#stb-rider) rotate, about the seat at symbol (200,158), so the rider
     leans off the machine and the bars never leave the stem.

     REDUCED MOTION parks the file at the REST frame, not at a demonstrated end
     state: the complete statement here is the level machine with its plumb
     centred and equal margins - that is the thing being applied four ways, and
     each medallion already shows one application statically. -->
<style>
