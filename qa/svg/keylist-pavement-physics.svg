<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
<title>Three facts meeting at the pavement: a knobby tire whose carcass bulges sideways under load on hard ground, a solid rear axle that forces its outside wheel to scrub, and a geared rider's quad tipped onto its outside wheels with the weight line walking out toward the edge of its support.</title>
