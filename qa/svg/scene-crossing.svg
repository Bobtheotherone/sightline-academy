<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img">
<title>Plan view of a dirt trail crossing a paved road: a geared rider has stopped at the stop line short of the pavement, with dotted sight lines drawn left and right along the road to markers at the limit of view, a car in the far lane, and the next rider waiting one machine length back.</title>
<style>
.xc-q1,.xc-q2,.xc-q3,.xc-car{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:linear}
.xc-swL,.xc-swR{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.xc-q1{animation-name:xc-cross}
.xc-q2{animation-name:xc-adv}
.xc-q3{animation-name:xc-arr}
.xc-car{animation-name:xc-drive}
.xc-swL{animation-name:xc-lsL}
.xc-swR{animation-name:xc-lsR}
@keyframes xc-cross{0%,78.5%{transform:translateY(0px);opacity:1;animation-timing-function:cubic-bezier(.45,0,.75,1)}85%{transform:translateY(-278px);opacity:1;animation-timing-function:linear}88.5%,100%{transform:translateY(-312px);opacity:0}}
@keyframes xc-adv{0%,80.5%{transform:translateY(0px);animation-timing-function:cubic-bezier(.25,0,.2,1)}85.5%,100%{transform:translateY(-130px)}}
@keyframes xc-arr{0%,82.5%{transform:translateY(180px);animation-timing-function:cubic-bezier(.25,0,.2,1)}87.5%,100%{transform:translateY(0px)}}
@keyframes xc-drive{0%,48.5%{transform:translateX(110px)}79.2%{transform:translateX(1120px);animation-timing-function:steps(1,end)}80%,92%{transform:translateX(-140px)}99%,100%{transform:translateX(110px)}}
@keyframes xc-lsL{0%,20%{stroke-dashoffset:0}22%,25.5%{stroke-dashoffset:100}28%,34.5%{stroke-dashoffset:0}36.5%,47%{stroke-dashoffset:100}49.5%,55%{stroke-dashoffset:0}56.5%,88.5%{stroke-dashoffset:100}90.5%,100%{stroke-dashoffset:0}}
@keyframes xc-lsR{0%,20%{stroke-dashoffset:0}22%,39%{stroke-dashoffset:100}41.5%,44.5%{stroke-dashoffset:0}46.5%,91%{stroke-dashoffset:100}93%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
.xc-q1,.xc-q2,.xc-q3,.xc-car,.xc-swL,.xc-swR{animation:none}
.xc-q1,.xc-q2{transform:translateY(0px);opacity:1}
.xc-q3{transform:translateY(180px)}
.xc-car{transform:translateX(110px)}
.xc-swL,.xc-swR{stroke-dashoffset:0}}
</style>
