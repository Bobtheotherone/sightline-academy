<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
<title>Four families of change: water and light degrade the trail you are reading, while cold, heat and dust degrade the rider doing the reading.</title>
<!-- C-007 keylist-four-families - animated split plate, hotspot_figure 3:2.

     LEFT = the trail (packed dirt, DARKER than the ground it crosses, paired
     rut dashes, three roots crossing it, one puddle with dry trail either side,
     a dusk sky band). RIGHT = the rider (whole geared body) with a small quad
     ahead of him throwing one dust cone. Seal centres: water (148,181) r117,
     light (421,181) r117, temperature (1033,194) r101, dust (1050,542) r107.
     No magenta - the seals are the magenta on a hotspot plate.

     ONE outline weight: 3.6. Interior detail: 2. House contours: 1.
     The trail must never read as a road (edges wander, ruts converge with them)
     nor as a stream (dirt is darker than its surround; the wet patch is a small
     irregular puddle with dry trail on both sides of it, no highlights).
     Each root is ONE closed silhouette with its fork built into the outline, so
     a fork never reads as a second stick laid across the first; the top root
     comes out from under the near conifer's base, which is what names them.

     14 s LOOP. The halves take turns; only one moves at a time.
       0-32%    0.00-4.48s  REST = the complete state and the reduced-motion
                            state: puddle wide, sky dark, cast shadows faint,
                            mercury mid, dust cone out, visor tinted.
       32-35%               left resets - sky lifts to paper, puddle shrinks
       35-46%               WATER: rain falls on the trail, puddle spreads back
       48-52%               LIGHT: sky darkens paper -> pine-100, cast shadows
                            fade. Rain has stopped first, so the darkening is
                            not misread as more weather.
       56-83%               TEMPERATURE: mercury drops (cold) then climbs past
                            mid (heat); the gloved hands (sage cuffs) clench in
                            and up 15/17 units on the cold swing and drop loose
                            on the heat swing. Every leg is 700 ms.
       83-92%               DUST: the cone clears off the rear tires and slides
                            back out behind the rider; his visor re-tints.
       92-100%              hold, running on into the next cycle's 0-32% head
                            for 5.6 s of continuous rest.

     Rain is the one free-running period: 1.75 s, and 1.75 x 8 = 14 exactly, so
     the drops sit in the same place at 0% and 100% and the loop closes clean.
     Served through <img>: no JS, no page CSS. The @media block is this file's
     own kill switch and parks every element in the COMPLETE state. -->
<style>
.ff-rain{animation:ff-rn 1.75s linear infinite}
@keyframes ff-rn{to{transform:translateY(96px)}}
.ff-rop{animation:ff-rop 14s infinite}
@keyframes ff-rop{0%,33%{opacity:0}35%,46%{opacity:1}49%,100%{opacity:0}}
.ff-wet{animation:ff-wet 14s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes ff-wet{0%,32%{transform:scale(1);animation-timing-function:cubic-bezier(.4,0,.2,1)}35%,37%{transform:scale(.32);animation-timing-function:cubic-bezier(0,0,.2,1)}42%,100%{transform:scale(1)}}
.ff-lite{animation:ff-lite 14s infinite}
@keyframes ff-lite{0%,32%{opacity:0;animation-timing-function:cubic-bezier(.4,0,.2,1)}35%,48%{opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}52%,100%{opacity:0}}
.ff-dim{animation:ff-dim 14s infinite}
@keyframes ff-dim{0%,32%{opacity:.14;animation-timing-function:cubic-bezier(.4,0,.2,1)}35%,48%{opacity:.42;animation-timing-function:cubic-bezier(.4,0,.2,1)}52%,100%{opacity:.14}}
.ff-merc{animation:ff-merc 14s infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes ff-merc{0%,56%{transform:scaleY(.58);animation-timing-function:cubic-bezier(.4,0,.2,1)}61%,67%{transform:scaleY(.24);animation-timing-function:cubic-bezier(.4,0,.2,1)}72%,78%{transform:scaleY(.97);animation-timing-function:cubic-bezier(.4,0,.2,1)}83%,100%{transform:scaleY(.58)}}
.ff-gla{animation:ff-gla 14s infinite}
@keyframes ff-gla{0%,56%{transform:translate(0,0);animation-timing-function:cubic-bezier(.4,0,.2,1)}61%,67%{transform:translate(15px,-17px);animation-timing-function:cubic-bezier(.4,0,.2,1)}72%,78%{transform:translate(-5px,9px);animation-timing-function:cubic-bezier(.4,0,.2,1)}83%,100%{transform:translate(0,0)}}
.ff-glb{animation:ff-glb 14s infinite}
@keyframes ff-glb{0%,56%{transform:translate(0,0);animation-timing-function:cubic-bezier(.4,0,.2,1)}61%,67%{transform:translate(-15px,-17px);animation-timing-function:cubic-bezier(.4,0,.2,1)}72%,78%{transform:translate(5px,9px);animation-timing-function:cubic-bezier(.4,0,.2,1)}83%,100%{transform:translate(0,0)}}
.ff-dust{animation:ff-dust 14s infinite}
@keyframes ff-dust{0%,83%{opacity:1;transform:translateX(0);animation-timing-function:cubic-bezier(.4,0,.2,1)}87%{opacity:0;transform:translateX(-30px);animation-timing-function:cubic-bezier(0,0,.2,1)}92%,100%{opacity:1;transform:translateX(0)}}
.ff-vis{animation:ff-vis 14s infinite}
@keyframes ff-vis{0%,83%{opacity:.38;animation-timing-function:cubic-bezier(.4,0,.2,1)}87%{opacity:0;animation-timing-function:cubic-bezier(0,0,.2,1)}92%,100%{opacity:.38}}
@media (prefers-reduced-motion:reduce){
.ff-rain,.ff-rop,.ff-wet,.ff-lite,.ff-dim,.ff-merc,.ff-gla,.ff-glb,.ff-dust,.ff-vis{animation:none}
.ff-rain{transform:none}
.ff-rop{opacity:0}
.ff-wet{transform:scale(1)}
.ff-lite{opacity:0}
.ff-dim{opacity:.14}
.ff-merc{transform:scaleY(.58)}
.ff-gla,.ff-glb{transform:none}
.ff-dust{opacity:1;transform:none}
.ff-vis{opacity:.38}
}
</style>
