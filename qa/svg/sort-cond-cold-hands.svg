<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" fill="none" stroke="#0D1E2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>A gloved hand closed stiffly on the brake lever as snow and drizzle fall — hands gone cold, stop and tend the rider.</title>

  <!-- handlebar: the dominant horizontal, bar end outboard left, running behind the fist and out to the right -->
  <path d="M9.5 21.5 H55.5 A5.5 5.5 0 0 1 55.5 32.5 H9.5 A5.5 5.5 0 0 1 9.5 21.5 Z" fill="#ABCDB8"/>

  <!-- lever perch clamped under the bar; blade hinged off it, threading through the fist and out past it -->
  <rect x="50" y="27.6" width="5.6" height="10.6" rx="2.6" fill="#0D1E2E" stroke="none"/>
  <path d="M52.7 36.4 L4.4 39.4" stroke-width="3.4"/>

  <!-- the closed fist: knuckles over the bar, four curled fingertips tucked under it onto the blade -->
  <path d="M13.2 33.2 C11.8 26.6 14.2 20 19 16.6 C24 13.2 33.4 13.4 37.8 16.6 C41 18.8 42.4 22.6 42.4 27.2 C42.4 31.4 41.6 34.6 40.4 35.8 A4.2 4.2 0 0 1 33.8 39.6 A3.4 3.4 0 0 1 27.8 40.2 A3.4 3.4 0 0 1 21.8 39.8 A4.4 4.4 0 0 1 14.8 35.8 C13.6 34.8 13.2 34.2 13.2 33.2 Z" fill="#ABCDB8"/>

  <!-- knuckle line, thumb wrapped round the inboard side, three finger creases curling inboard -->
  <g stroke-width="1.8">
    <path d="M14 31.4 C20 28.8 30 28.2 36.6 29.2"/>
    <path d="M36.6 29.2 C39.4 31.4 40.8 33.6 40.4 35.8"/>
    <path d="M31 28.8 C30 32.6 30.6 36.6 33.8 39.6"/>
    <path d="M25 28.8 C24 32.6 24.6 36.8 27.8 40.2"/>
    <path d="M19.2 29.8 C18.2 33.4 18.8 37 21.8 39.8"/>
  </g>

  <!-- cold: one snow flake upper right, drizzle slanting past the hand -->
  <path d="M52.7 5.3 V16.3 M47.9 8.05 L57.5 13.55 M47.9 13.55 L57.5 8.05" stroke-width="2.2"/>
  <path d="M10.2 3.4 L5.4 15.4 M18.6 2.6 L13.8 14.6" stroke-width="2.2"/>
</svg>
