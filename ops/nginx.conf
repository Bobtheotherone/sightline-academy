# Sightline Safety Academy — nginx config for the web container (SPEC-012).
# Serves the built SPA, proxies /api/* to the api container, long-caches hashed
# assets, falls back to index.html for client-side routes.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    server {
        # Dual-stack listen: the container healthcheck (busybox wget) resolves
        # `localhost` to ::1 first, so IPv4-only listening reads as unhealthy.
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers (SPEC-012). NOTE: add_header resets inheritance, so
        # any location below that sets its own headers repeats these.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

        # API proxy — no URI part on proxy_pass, so the /api/... path is
        # preserved exactly as FastAPI expects it.
        location /api {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Tutor answers can stream via SSE (SPEC-002 R5.6): stream through
            # unbuffered, and outlive the server's own 30s tutor timeout.
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 75s;
        }

        # Static healthcheck target for the container healthcheck.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Vite emits content-hashed filenames under /assets/ — immutable.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
            try_files $uri =404;
        }

        # SPA fallback: unknown paths serve the app shell; index.html itself is
        # always revalidated so deploys take effect immediately.
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
