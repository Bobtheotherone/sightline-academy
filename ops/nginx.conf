# Sightline Safety Academy — nginx config for the web container (SPEC-012).
# Serves the built SPA, proxies /api/* to the api container, long-caches hashed
# assets, falls back to index.html for client-side routes.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Edge rate limiting, keyed on the real socket peer ($binary_remote_addr —
    # never a client-supplied header, which is precisely the value an attacker
    # can vary). This sits in front of the application's own per-IP and
    # per-account limiters: password verification is argon2id and deliberately
    # expensive, so the cheapest place to shed a flood is before it gets there.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    server {
        # Dual-stack listen: the container healthcheck (busybox wget) resolves
        # `localhost` to ::1 first, so IPv4-only listening reads as unhealthy.
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers (SPEC-012). NOTE: add_header resets inheritance, so
        # any location below that sets its own headers repeats these.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # HSTS. Harmless over plain HTTP (browsers ignore it on non-TLS origins)
        # and load-bearing the moment TLS terminates in front of this container,
        # which is the documented production topology.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # API proxy — no URI part on proxy_pass, so the /api/... path is
        # preserved exactly as FastAPI expects it.
        # Sign-in and sign-up: the brute-force surface. burst=5 absorbs an honest
        # user's retries; nodelay answers the excess immediately with 429
        # rather than queueing it and holding a worker.
        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Appends the real peer to whatever the client sent, so the chain
            # reaching the app ends with the address WE observed. The app reads
            # it from the right (TRUSTED_PROXY_HOPS=1) and therefore ignores
            # every entry the caller fabricated on the left.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Tutor answers can stream via SSE (SPEC-002 R5.6): stream through
            # unbuffered, and outlive the server's own 30s tutor timeout.
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 75s;
        }

        # Static healthcheck target for the container healthcheck.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Vite emits content-hashed filenames under /assets/ — immutable.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            try_files $uri =404;
        }

        # SPA fallback: unknown paths serve the app shell; index.html itself is
        # always revalidated so deploys take effect immediately.
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
