# Sightline Safety Academy — single-host deployment (SPEC-012 / ADR-009).
# Run from the repo root:  docker compose -f ops/docker-compose.yml up -d --build
# Requires ./.env at the repo root (cp .env.example .env, then edit).

name: sightline

services:
  # One-shot: make the data volume writable by the unprivileged app user.
  #
  # The API container runs as uid 10001 (Dockerfile.api). Docker only copies
  # ownership from the image into a named volume the first time that volume is
  # created — an existing volume from an earlier, root-running build keeps its
  # root ownership, and the app then dies with "attempt to write a readonly
  # database" on boot. Fixing it here means both a fresh install and an upgrade
  # of an existing one just work, with no manual step to forget.
  data-init:
    image: busybox:1.36
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data && chmod 0750 /data"]
    volumes:
      - sightline-data:/data
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATA_DIR: /data
    volumes:
      - sightline-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # python is what the image has (no curl in python:3.12-slim); urlopen
      # raises on any non-2xx, which fails the check.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/meta/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First boot runs seed + corpus ingest + embedding-model warm-up.
      start_period: 120s

  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  sightline-data:
